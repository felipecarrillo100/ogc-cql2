# The proof routine on every push to main and every pull request: checks only, nothing is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # SpatiaLite, so the Spatial Functions tests of the sqlite dialect run rather than skip. Ubuntu 26.04's is built
      # with GEOS 3.14; 24.04's GEOS 3.12 is older than the 3.13 that GeometryCollection literals need (README).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-mod-spatialite
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CQL2_SPATIALITE: mod_spatialite
      - run: npm run build
      - run: npm run check:imports
      - run: npm run check:bundle
      - run: npm run build:demo

  demo-server:
    name: demo-server (PostgreSQL + PostGIS, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    # The demo's role and database, as data/setup-postgres-admin.sql names them; the password is the container's,
    # which lives only for this job.
    env:
      CQL2_SPATIALITE: mod_spatialite
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: apipeatures
      PGPASSWORD: ci
      PGDATABASE: apipeatures
    services:
      postgres:
        # Multi-arch (amd64 and arm64); the official postgis/postgis image is amd64 only.
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: apipeatures
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: apipeatures
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apipeatures"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-server/package-lock.json
      # psql and ogr2ogr, for data/load-postgres.sh; SpatiaLite, for the GeoPackage store's Spatial Functions.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client gdal-bin libsqlite3-mod-spatialite
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo-server
      - run: psql -X -q -v ON_ERROR_STOP=1 -f data/setup-postgres-admin.sql
        working-directory: demo-server
      - run: sh data/load-postgres.sh
        working-directory: demo-server
      - run: npm test
        working-directory: demo-server
